<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PDF Splitter</title>
        <style>
            body {
                background-color: rgba(255, 0, 0, 0.274);
            }

            * {
                box-sizing: border-box;
                margin: 1rem 0;
                padding: 0;
                font-family: monospace;
                font-weight: 900;
                transition: all 200ms ease-in;
            }

            #container {
                display: flex;
                flex-direction: column;
                text-align: center;
                height: 100%;
                justify-content: center;
                padding-top: 4rem;
            }

            input {
                width: fit-content;
                padding: 1rem;
                font-size: large;
                text-transform: capitalize;
                align-self: center;
            }

            label {
                font-size: 24px;
            }

            h1 {

                font-size: 68px;
            }

            #quit {
                border-radius: 10px;
                padding: 1rem 2rem;
                border: 2px solid red;
                background-color: rgb(255, 255, 255);
                font-size: 20px;
                font-weight: 1200;
                cursor: pointer;
            }

            #quit:hover {
                background-color: rgb(255, 0, 0);
                color: white;
                border-color: white;
            }
            #submit {
                border-radius: 10px;
                padding: 1rem 2rem;
                border: 2px solid rgb(3, 203, 3);
                background-color: rgb(255, 255, 255);
                font-size: 20px;
                font-weight: 1200;
                cursor: pointer;
            }

            #submit:hover {
                background-color: rgb(3, 203, 3);
                color: white;
                border-color: white;
            }
        </style>
    </head>

    <body>
        <div id="container">
            <input type="submit" value="Quit" id="quit" onclick="Exit()">
            <h1>PDF Splitter</h1>
            <h2>-By <b style="color: red;">Krishna</b></h2>
            <form action="/download" method="post" enctype="multipart/form-data">
                <div>
                    <label for="pdf">PDF File : </label>
                    <input type="file" name="pdffile" id="pdf" style="width: fit-content;">
                </div>
                <label for="pageno">Page From File: </label>
                <input type="number" name="page" id="pageno" value="10">
                <input type="submit" value="submit" id="submit">
            </form>
        </div>
    </body>
    <script>
        function Exit(){
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/exit", true);
            xhr.send();
        }
        
    </script>

</html>
